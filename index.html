  :root{--ink:#15212e;--ink-soft:#516072;--line:#e2e8f0;--line-2:#eef2f6;--paper:#fff;--panel:#f7f9fb;--chip:#eef3f8;
   --accent:#1d6fb8;--accent-soft:#e8f1f9;--up:#0e7c4f;--down:#c2392f;--flat:#6b7280;
   --shadow:0 1px 2px rgba(16,30,48,.06),0 8px 24px rgba(16,30,48,.08);
   --font:"Segoe UI",system-ui,"Arial Hebrew","Noto Sans Hebrew",Arial,sans-serif;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--panel)}
  .num{font-variant-numeric:tabular-nums}
  .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .app{display:grid;grid-template-columns:392px 1fr;grid-template-rows:auto 1fr;height:100vh;grid-template-areas:"head head" "side map"}
  header{grid-area:head;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:12px 22px;flex-wrap:wrap}
  header h1{font-weight:800;font-size:18px;margin:0}
  header .sub{font-size:12px;color:var(--ink-soft);margin-top:3px;max-width:760px;line-height:1.5}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  header>div:first-child{margin-inline-end:auto}
  .brand{height:42px;width:auto;flex:0 0 auto;align-self:center;margin-inline-start:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 14px;min-width:104px}
  .stat .k{font-size:11px;color:var(--ink-soft);font-weight:600}
  .stat .v{font-weight:800;font-size:18px;margin-top:1px;direction:ltr;text-align:right}
  .stat .v.neg{color:var(--down)} .stat .v.pos{color:var(--up)}
  aside{grid-area:side;background:var(--paper);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .controls{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .controls label{font-size:12px;font-weight:600;color:var(--ink-soft)}
  .selrow{display:flex;gap:8px}
  select,input[type=search]{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
  select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .reset{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 12px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink-soft)}
  .reset:hover{background:var(--panel)}
  .listwrap{flex:1 1 auto;overflow:auto;padding:8px 10px}
  .sech{font-size:11px;font-weight:700;color:var(--ink-soft);padding:8px 6px 4px}
  .lcard{display:flex;align-items:flex-start;gap:11px;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent}
  .lcard:hover{background:var(--panel)} .lcard.active{background:var(--accent-soft);border-color:#cfe2f1}
  .swatch{width:11px;height:30px;border-radius:4px;flex:0 0 auto;margin-top:1px}
  .lcard .meta{display:flex;flex-direction:column;min-width:0;flex:1}
  .lcard .od{font-size:13px;font-weight:600}
  .lcard .ch{font-size:11.5px;color:var(--ink-soft);margin-top:1px;line-height:1.3}
  .lcard .figs{display:flex;gap:10px;margin-top:3px;font-size:11.5px;font-weight:700}
  .lcard .nomap{font-size:10.5px;color:#a15c00;background:#fff4e2;border:1px solid #ffe0b0;border-radius:6px;padding:1px 6px;margin-top:3px;display:inline-block;width:max-content}
  .details{border-top:1px solid var(--line);background:var(--panel);max-height:50%;overflow:auto}
  .details .empty{padding:22px 18px;color:var(--ink-soft);font-size:13px;text-align:center}
  .dh{padding:14px 16px 10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
  .dh .row1{display:flex;align-items:center;gap:10px}
  .dh .big{font-weight:800;font-size:22px}
  .dh .od{font-size:14px;color:var(--ink-soft);margin-top:3px}
  .dh .ch{font-size:12.5px;color:var(--ink);margin-top:4px;font-weight:600}
  .dbody{padding:12px 16px 18px}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .kv .cell{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .kv .cell .lab{font-size:10.5px;color:var(--ink-soft);font-weight:600}
  .kv .cell .val{font-weight:800;font-size:16px;margin-top:1px}
  table.bt{width:100%;border-collapse:collapse;font-size:12.5px}
  table.bt th{font-size:10.5px;color:var(--ink-soft);font-weight:700;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
  table.bt td{padding:5px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
  table.bt td.n{direction:ltr;unicode-bidi:isolate;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  table.bt .sub{font-size:10px;color:var(--ink-soft)}
  table.bt tr.cancel td{color:#9aa3ad}
  .dirpill{display:inline-block;font-size:11px;font-weight:700;background:var(--chip);border-radius:999px;padding:2px 7px;color:var(--ink-soft)}
  .mapwrap{grid-area:map;position:relative}
  #map{position:absolute;inset:0;background:#dde4ea}
  .legend{position:absolute;z-index:1000;bottom:12px;inset-inline-start:12px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:9px 12px;width:max-content}
  .legend .lt{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
  .legend .items{display:grid;grid-template-columns:auto auto;gap:6px 18px}
  .legend .it{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
  .legend .it span.sw{width:13px;height:4px;border-radius:2px}
  .legend .it.nomap{opacity:.6}
  .modectl{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px 8px}.modectl .mt{font-size:10.5px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;text-align:center}.modectl .mb{display:flex;gap:3px}.modectl .mb button{font-family:inherit;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:7px;padding:4px 10px;cursor:pointer}.modectl .mb button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.modectl .mb button:hover:not(.on){background:var(--panel)}.modectl .mh{font-size:10px;color:var(--ink-soft);margin-top:5px;text-align:center;line-height:1.4}.leaflet-container{font-family:var(--font)}
  .cityLbl{background:transparent;border:none;box-shadow:none;color:#2b3642;font-weight:700;font-size:11.5px;padding:0;text-shadow:0 1px 2px #fff,0 0 3px #fff,1px 1px 2px #fff,-1px -1px 2px #fff}
  .cityLbl::before{display:none}
  .baseCity{color:#5c6672;font-weight:600;font-size:11px;white-space:nowrap;text-shadow:0 1px 2px #fff,0 0 3px #fff,1px 1px 2px #fff,-1px -1px 2px #fff}
  .baseCity .dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:#8a94a0;margin-inline-end:3px;vertical-align:middle}
  .linePopup .leaflet-popup-content{margin:11px 13px;direction:rtl}
  .linePopup .leaflet-popup-content-wrapper{border-radius:12px}
  .lp .ph{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800}
  .lp .ph .sw{width:10px;height:20px;border-radius:3px}
  .lp .po{font-size:12.5px;color:var(--ink-soft);margin:4px 0 6px}
  .lp .pc{font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-bottom:8px}
  .lp table{width:100%;border-collapse:collapse;font-size:13px}
  .lp table td{padding:5px 2px;border-top:1px solid var(--line-2)}
  .lp table td:first-child{color:var(--ink-soft)} .lp table td:last-child{text-align:left;font-weight:700}
  @media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto 340px 1fr;grid-template-areas:"head" "map" "side"}
    aside{border-inline-start:0;border-top:1px solid var(--line)} .details{max-height:none} .kv{grid-template-columns:1fr 1fr}}
</style></head><body>

      (hasGeom(line)?(isApprox(line)?'<span class="nomap">מסלול משוער (מבוסס מסדרון קיים)</span>':''):'<span class="nomap">אין מסלול במפה (קו חדש)</span>')+'</div>';
    card.onclick=()=>selectLine(line);listEl.appendChild(card);});}

/* legend */
const legEl=document.getElementById('legend');
allLines.forEach(line=>{const it=document.createElement('div');it.className='it'+(hasGeom(line)?'':' nomap');
  it.innerHTML='<span class="sw" style="background:'+PALETTE[line]+'"></span>'+line;it.onclick=()=>selectLine(line);legEl.appendChild(it);});
L.DomEvent.disableClickPropagation(document.querySelector('.legend'));L.DomEvent.disableScrollPropagation(document.querySelector('.legend'));

/* selection */
let selectedLine=null, mapMode='prop';
function hasExist(ln){return !!existByLine[ln];}
function setOn(o,on){if(on){if(!map.hasLayer(o.halo))o.halo.addTo(map);if(!map.hasLayer(o.pl))o.pl.addTo(map);}else{if(map.hasLayer(o.halo))map.removeLayer(o.halo);if(map.hasLayer(o.pl))map.removeLayer(o.pl);}}
function render(){allLines.forEach(ln=>{const sel=(selectedLine===ln),dim=(selectedLine&&!sel),col=PALETTE[ln]||'#444';
  const showProp=(mapMode==='prop'||mapMode==='compare');
  (propByLine[ln]||[]).forEach(o=>{setOn(o,showProp);if(!showProp)return;const canc=(o.f.properties.trips_new===0);
    o.pl.setStyle({color:col,opacity:dim?.12:.95,weight:sel?6:4,dashArray:canc?'4 7':null});
    o.halo.setStyle({opacity:dim?.05:.85,weight:sel?9:7});});
  const showExist=hasExist(ln)&&(mapMode==='exist'||mapMode==='compare');
  (existByLine[ln]||[]).forEach(o=>{setOn(o,showExist);if(!showExist)return;const solid=(mapMode==='exist');
    o.pl.setStyle({color:col,opacity:dim?.14:.95,weight:sel?(solid?6:4.5):(solid?4:3.2),dashArray:solid?null:'7 6'});
    o.halo.setStyle({opacity:dim?.05:.8,weight:sel?9:7});});
});
if(selectedLine){[existByLine,propByLine].forEach(S=>{(S[selectedLine]||[]).forEach(o=>{try{if(map.hasLayer(o.pl)){o.halo.bringToFront();o.pl.bringToFront();}}catch(e){}});});}
}
function styleLines(){render();}
function selectLine(line){selectedLine=line;document.getElementById('lineSel').value=line;styleLines();
  [...listEl.children].forEach(c=>c.classList.toggle('active',c.dataset.line===line));
  if(hasGeom(line)){const ll=[];featByLine[line].forEach(f=>f.geometry.coordinates.forEach(c=>ll.push([c[1],c[0]])));
    map.fitBounds(L.latLngBounds(ll),{padding:[45,45],maxZoom:12});openPopup(line);}
  else{map.closePopup();}
  renderDetails(line);
  const ac=[...listEl.children].find(c=>c.dataset.line===line);if(ac)ac.scrollIntoView({block:'nearest'});}

function openPopup(line){const s=SUMMARY[line],a=agg(line);const c=featByLine[line][0].geometry.coordinates,m=c[Math.floor(c.length/2)];
  const html='<div class="lp"><div class="ph"><span class="sw" style="background:'+PALETTE[line]+'"></span>קו '+line+'</div>'+
    '<div class="po">'+s.o+' ↔ '+s.d+'</div><div class="pc">'+s.c+'</div>'+
    '<table><tr><td>נסיעות שבועיות – קיים</td><td class="ltr">'+fmt(a.te)+'</td></tr>'+
    '<tr><td>נסיעות שבועיות – מוצע</td><td class="ltr">'+fmt(a.tn)+'</td></tr>'+
    '<tr><td>שינוי ק״מ שבועי</td><td class="ltr" style="color:'+colKm(s.kd)+'">'+sgn(s.kd)+'</td></tr></table></div>';
  L.popup({maxWidth:320,className:'linePopup',autoPan:false}).setLatLng([m[1],m[0]]).setContent(html).openOn(map);}

function renderDetails(line){const det=document.getElementById('details');const s=SUMMARY[line],a=agg(line);const nc=(a.te===0&&a.tn===0);
  let h='<div class="dh"><div class="row1"><span class="swatch" style="background:'+PALETTE[line]+';height:24px"></span>'+
    '<span class="big num">קו '+line+'</span></div><div class="od">'+s.o+' ↔ '+s.d+'</div><div class="ch">'+s.c+
    (hasGeom(line)?(isApprox(line)?' · <span style="color:#a15c00">מסלול משוער (מבוסס מסדרון 885)</span>':''):' · <span style="color:#a15c00">המסלול אינו מצויר במפה (קו חדש)</span>')+'</div></div><div class="dbody">';
  if(nc){h+='<div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-soft);margin-bottom:12px">קו קיים ברשת — ללא שינוי בפעימת נובמבר, ואינו נכלל בחישוב סך התשומות.</div>';}
  else{h+='<div class="kv">'+
    '<div class="cell"><div class="lab">נסיעות קיים</div><div class="val ltr">'+fmt(a.te)+'</div></div>'+
    '<div class="cell"><div class="lab">נסיעות מוצע</div><div class="val ltr">'+fmt(a.tn)+'</div></div>'+
    '<div class="cell"><div class="lab">שינוי ק״מ</div><div class="val ltr" style="color:'+colKm(s.kd)+'">'+sgn(s.kd)+'</div></div></div>';}
  const keys=Object.keys(PLAN).filter(k=>k.split('-')[0]===line);
  h+='<table class="bt"><tr><th>כיוון·חלופה</th><th>מוצא</th><th>יעד</th><th>אורך ק״מ</th><th>נסיעות שבועיות</th></tr>';
  keys.forEach(k=>{const p=PLAN[k],parts=k.split('-'),cancel=(p.tn===0&&!nc);
    const lenC=(p.le===p.ln)?L2(fmt(p.le)):('<span class="sub">קיים</span> '+L2(fmt(p.le))+'<br><span class="sub">מוצע</span> '+L2(fmt(p.ln)));
    const trpC=nc?'<span class="sub">ללא שינוי</span>':('<span class="sub">קיים</span> '+L2(fmt(p.te))+'<br><span class="sub">מוצע</span> '+L2(fmt(p.tn))+(cancel?' <span style="color:var(--down)">מבוטל</span>':''));
    h+='<tr class="'+(cancel?'cancel':'')+'"><td><span class="dirpill">'+parts[1]+'·'+parts[2]+'</span></td>'+
       '<td>'+p.o+'</td><td>'+p.d+'</td><td class="n">'+lenC+'</td><td class="n">'+trpC+'</td></tr>';});
  h+='</table></div>';det.innerHTML=h;}

/* filter + search */
const sel=document.getElementById('lineSel');
allLines.forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent='קו '+l;sel.appendChild(o);});
sel.onchange=()=>{sel.value==='all'?clearSel():selectLine(sel.value);};
document.getElementById('resetBtn').onclick=clearSel;
const MODES=[['prop','מוצע'],['exist','קיים'],['compare','השוואה']];
const ModeCtl=L.Control.extend({options:{position:'topleft'},onAdd:function(){var d=L.DomUtil.create('div','modectl');
  d.innerHTML='<div class="mt">תצוגת מסלולים</div><div class="mb">'+MODES.map(function(m){return '<button data-m="'+m[0]+'"'+(m[0]==='prop'?' class="on"':'')+'>'+m[1]+'</button>';}).join('')+'</div><div class="mh">מקווקו = קיים · מלא = מוצע</div>';
  L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);return d;}});
map.addControl(new ModeCtl());
document.querySelectorAll('.modectl .mb button').forEach(function(btn){btn.onclick=function(){mapMode=btn.dataset.m;document.querySelectorAll('.modectl .mb button').forEach(function(b){b.classList.toggle('on',b===btn);});render();};});
render();

function clearSel(){selectedLine=null;sel.value='all';styleLines();[...listEl.children].forEach(c=>c.classList.remove('active'));
  document.getElementById('search').value='';renderList();map.closePopup();map.fitBounds(ALL_BOUNDS,{padding:[30,30]});
  document.getElementById('details').innerHTML='<div class="empty">לחצו על קו במפה או ברשימה כדי לראות מוצא/יעד, מהות השינוי, ואורכים ונסיעות במצב קיים מול מוצע.</div>';}
document.getElementById('search').oninput=e=>{const q=e.target.value.trim();renderList(line=>{if(!q)return true;const s=SUMMARY[line];return line.includes(q)||(s.o||'').includes(q)||(s.d||'').includes(q);});};

renderList();
map.fitBounds(ALL_BOUNDS,{padding:[30,30]});
window.addEventListener('resize',()=>map.invalidateSize());setTimeout(()=>map.invalidateSize(),200);

</script></body></html>
